server:
  http_listen_port: 3200

stream_over_http_enabled: true

query_frontend:
  search:
    duration_slo: 5s
  trace_by_id:
    duration_slo: 5s

# Tempo receives traces only from Alloy on dokploy-network.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
