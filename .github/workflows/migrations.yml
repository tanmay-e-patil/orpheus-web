name: Database Migrations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  database-operations:
    name: Database Migrations Check & Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for schema changes
        run: bun run db:generate
        env:
          DATABASE_URL: postgres://dummy:dummy@localhost:5432/dummy

      - name: Verify no new migrations generated
        run: |
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "New migration files were generated. Please run 'bun run db:generate' locally and commit the changes."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Run migrations
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
