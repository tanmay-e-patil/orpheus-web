name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Refresh the cache when dependencies or the test workflow change.
          cache-dependency-path: |
            go.mod
            go.sum
            .github/workflows/go.yml
      - name: Download all Go modules, including integration dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Test outbox with PostgreSQL and RabbitMQ
        run: go test -race -tags=integration ./internal/store ./internal/services -count=1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check Svelte and TypeScript
        run: npm run check --prefix frontend
      - name: Test frontend
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
