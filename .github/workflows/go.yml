name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # Refresh the cache when dependencies or the test workflow change.
          cache-dependency-path: |
            go.mod
            go.sum
            .github/workflows/go.yml
      - name: Download all Go modules, including integration dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Test outbox with PostgreSQL and RabbitMQ
        run: go test -race -tags=integration ./internal/store ./internal/services -count=1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Check Svelte and TypeScript
        working-directory: frontend
        run: bun run check
      - name: Test frontend
        working-directory: frontend
        run: bun run test
      - name: Build frontend
        working-directory: frontend
        run: bun run build
