<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e2e" />
    <title>Orpheus</title>
    <script>
      (() => {
        const themes = {
          "catppuccin-mocha": "#1e1e2e",
          dracula: "#282a36",
          "tokyo-night": "#1a1b26",
          "gruvbox-dark": "#282828",
          nord: "#2e3440",
          "solarized-light": "#fdf6e3",
        };
        const fallback = "catppuccin-mocha";
        const stored = localStorage.getItem("orpheus-theme");
        const theme = Object.prototype.hasOwnProperty.call(themes, stored) ? stored : fallback;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themes[theme]);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body>
    <div class="app-shell" data-auth-shell hidden>
      <aside class="sidebar">
        <a class="brand" href="/home" data-link aria-label="Orpheus home">Orpheus</a>
        <nav class="nav-list" aria-label="Primary">
          <a href="/home" data-link data-nav-path="/home">Tracks</a>
          <a href="/discover" data-link data-nav-path="/discover">Discover</a>
          <a href="/settings" data-link data-nav-path="/settings">Settings</a>
        </nav>
        <label class="theme-control">
          <span class="theme-label">Theme</span>
          <select class="theme-select" data-theme-select aria-label="Theme"></select>
        </label>
        <button class="button secondary danger sign-out-button" type="button">Sign out</button>
      </aside>

      <header class="mobile-nav">
        <a class="brand compact" href="/home" data-link>Orpheus</a>
        <nav class="mobile-nav-links" aria-label="Mobile primary">
          <a href="/home" data-link data-nav-path="/home">Tracks</a>
          <a href="/discover" data-link data-nav-path="/discover">Discover</a>
          <a href="/settings" data-link data-nav-path="/settings">Settings</a>
        </nav>
        <label class="theme-control mobile-theme-control">
          <span class="theme-label">Theme</span>
          <select class="theme-select" data-theme-select aria-label="Theme"></select>
        </label>
      </header>

      <div class="content-frame">
        <main id="route-outlet" class="route-outlet" tabindex="-1"></main>
        <aside class="lyrics-panel-shell" aria-label="Lyrics">
          <lyrics-view></lyrics-view>
        </aside>
      </div>
    </div>

    <main id="public-route-outlet" class="public-route-outlet" tabindex="-1" hidden>
      <section class="login-page" data-login-fallback>
        <form class="login-card">
          <h1>Orpheus</h1>
          <p class="muted">Sign in to your account</p>
          <label>
            Email
            <input class="input" type="email" autocomplete="username webauthn" placeholder="you@example.com" />
          </label>
          <label>
            Password
            <input class="input" type="password" autocomplete="current-password" placeholder="********" />
          </label>
          <button class="button" type="button">Login</button>
          <p class="muted">Loading sign-in...</p>
        </form>
      </section>
    </main>

    <player-bar></player-bar>
    <dialog id="lyrics-overlay" class="lyrics-overlay">
      <div class="dialog-header">
        <h2>Lyrics</h2>
        <button class="icon-button" type="button" data-close-lyrics aria-label="Close lyrics">×</button>
      </div>
      <lyrics-view data-mobile-overlay="true"></lyrics-view>
    </dialog>
    <dialog id="app-dialog" class="app-dialog">
      <form method="dialog">
        <p id="app-dialog-message"></p>
        <button class="button" value="ok">OK</button>
      </form>
    </dialog>

    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
